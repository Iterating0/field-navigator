<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f9" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="从一个科研问题出发，梳理领域地图、核对支持论文，把值得读的文献整理成自己的阅读清单。"
    />
    <script>
      // Apply the saved preference before rendering to avoid a bright flash.
      let theme = "light";
      try {
        if (localStorage.getItem("field-navigator-theme") === "dark")
          theme = "dark";
      } catch {}
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content =
        theme === "dark" ? "#121b23" : "#f6f7f9";
    </script>
    <title>Field Navigator · 让研究有方向</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
